    - "NẾU tỉ lệ bỏ qua gợi ý > 40% TRONG 1 tuần liên tiếp THÌ Trưởng nhóm CSKH phỏng vấn trực tiếp 5 nhân viên có tỉ lệ bỏ qua cao nhất trong vòng 3 ngày để tìm điểm nghẽn KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
