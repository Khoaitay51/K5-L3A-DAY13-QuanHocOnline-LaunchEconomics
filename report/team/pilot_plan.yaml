    - "Chi phí mỗi việc thành công hang_nang: 8.221 đ (0,69× của 12.000 đ)"
    - "Chi phí cố định 40 triệu đ/tháng quy đổi: 4.599 đ/việc (ở 45.000 yc) và 5.784 đ/việc (ở 22.500 yc)"
