# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm để phát hiện chênh lệch 5 điểm phần trăm.
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48. Cần 3.103 yêu cầu và 42 nhân viên mỗi nhóm (84 người, hiện có 40).
#   c) 20 nhân viên mỗi nhóm: trần hiệu dụng 20 / 0,02 = 1.000, dưới mức cần là 1.251.
#   d) 6 depot mỗi nhóm: trần hiệu dụng 6 / 0,02 = 300 và chỉ có 6 cụm mỗi nhóm.
#   e) Mức chênh 6 điểm: cần 859 yêu cầu hiệu dụng mỗi nhóm. Giải 20m / (1 + (m − 1) × 0,02) ≥ 859 được m ≥ 299.
#      Với m = 299, DE = 6,96 và cần 5.980 yêu cầu quan sát được mỗi nhóm.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm song song cùng tuần, cùng 12 depot với nhóm can thiệp.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed cố định ghi trước (seed=42), phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ kinh nghiệm trong depot; giảm bằng phân quyền tài khoản cá nhân (staff_id) và log truy cập trợ lý riêng.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Đã viết trước: chỉ số chính dong_trong_24h_khong_mo_lai_7_ngay, baseline 0,70, MDE 0,06, 3 luật dừng và ngày chốt 2027-01-05.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 cụm mỗi nhóm (20 nhân viên mỗi nhóm, trên 12 depot).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Phương án D1: chia theo nhân viên, 20 người mỗi nhóm, MDE 6 điểm phần trăm.
#   Nếu tác động thật là 5 điểm, power tại n hiệu dụng = 859 chỉ còn 64,17%.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   51/1.200 = 4,25% toàn mẫu và 39/982 = 3,97% trong phạm vi noi_dia + hang_nang.
#   Đề xuất để TV3 chốt luật dừng: chênh lệch ≥ 2 điểm phần trăm so với đối chứng hoặc vượt 6% tuyệt đối.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated); loại quoc_te (1,88×) và doi_tac (0,85×)"
  assignment:
